---
# Deployment: CUE Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cue-backend
  namespace: nekazari
  labels:
    app: cue-backend
    component: backend
    module: cue
    nekazari.io/profile: addon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cue-backend
  template:
    metadata:
      labels:
        app: cue-backend
        component: backend
        module: cue
    spec:
      containers:
        - name: backend
          image: ghcr.io/nkz-os/nkz-module-cue/cue-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_NAME
              value: "Cuaderno de Campo (CUE)"
            - name: DEBUG
              value: "false"
            - name: KEYCLOAK_URL
              value: "https://auth.robotika.cloud/auth"
            - name: KEYCLOAK_REALM
              value: "nekazari"
            - name: JWT_AUDIENCE
              value: "account"
            - name: ORION_URL
              value: "http://orion-ld-service:1026"
            - name: CONTEXT_URL
              value: "http://api-gateway-service:5000/ngsi-ld-context.jsonld"
            - name: CUE_CONTEXT_URL
              value: "http://api-gateway-service:5000/ngsi-ld/cue-context.jsonld"
            - name: MODULE_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: module-secrets
                  key: management-key
                  optional: true
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-url
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3

---
# Service: CUE Backend
apiVersion: v1
kind: Service
metadata:
  name: cue-backend-service
  namespace: nekazari
  labels:
    app: cue-backend
    component: backend
    module: cue
spec:
  type: ClusterIP
  selector:
    app: cue-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
