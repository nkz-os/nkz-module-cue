---
# Deployment: CUE Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cue-backend
  namespace: nekazari
  labels:
    app: cue-backend
    component: backend
    module: cue
    nekazari.io/profile: addon
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cue-backend
  template:
    metadata:
      labels:
        app: cue-backend
        component: backend
        module: cue
    spec:
      containers:
        - name: backend
          image: ghcr.io/nkz-os/nkz-module-cue/cue-backend@sha256:eeaabba2c3a2f212e0f9209d613ccb3b29c071b442fa3e6d41529a99bfe62fb2
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: APP_NAME
              value: "Cuaderno de Campo (CUE)"
            - name: DEBUG
              value: "false"
            - name: KEYCLOAK_URL
              valueFrom:
                configMapKeyRef:
                  name: cue-config
                  key: KEYCLOAK_URL
            - name: KEYCLOAK_REALM
              value: "nekazari"
            - name: JWT_AUDIENCE
              value: "account"
            - name: KEYCLOAK_INTERNAL_URL
              value: "http://keycloak-service:8080/auth"
            - name: KEYCLOAK_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: admin-username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: admin-password
            - name: ORION_URL
              value: "http://orion-ld-service:1026"
            - name: CONTEXT_URL
              value: "http://api-gateway-service:5000/ngsi-ld-context.jsonld"
            - name: CUE_CONTEXT_URL
              value: "http://api-gateway-service:5000/ngsi-ld/cue-context.jsonld"
            - name: MODULE_MANAGEMENT_KEY
              valueFrom:
                secretKeyRef:
                  name: module-secrets
                  key: management-key
                  optional: true
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgres-url
            - name: MTLS_CERT_PATH
              value: "/etc/cue/certs/client.crt"
            - name: MTLS_KEY_PATH
              value: "/etc/cue/certs/client.key"
            - name: MTLS_CA_PATH
              value: "/etc/cue/certs/ca.crt"
          volumeMounts:
            - name: certs
              mountPath: /etc/cue/certs
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: certs
          secret:
            secretName: cue-mtls-certs
            optional: true

---
# Service: CUE Backend
apiVersion: v1
kind: Service
metadata:
  name: cue-backend-service
  namespace: nekazari
  labels:
    app: cue-backend
    component: backend
    module: cue
spec:
  type: ClusterIP
  selector:
    app: cue-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
